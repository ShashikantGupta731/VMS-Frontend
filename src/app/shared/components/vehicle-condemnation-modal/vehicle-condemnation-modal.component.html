<div class="modal-backdrop fade show"></div>
<div class="modal d-block" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-danger text-white border-0">
        <h5 class="modal-title d-flex align-items-center gap-2">
          <i class="pi pi-exclamation-triangle"></i>
          Condemn Vehicle: {{ vehicle?.registrationNumber }}
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="onClose()"></button>
      </div>
      
      <form [formGroup]="condemnForm" (ngSubmit)="onSubmit()">
        <div class="modal-body p-4">
          <div class="row g-3">
            <!-- Basic Info Section -->
            <div class="col-12">
              <h6 class="text-primary fw-bold border-bottom pb-2 mb-3">Condemnation Details</h6>
            </div>

            <div class="col-md-6">
              <app-input
                label="Condemnation Date"
                type="date"
                formControlName="condemnationDate"
                [required]="true"
                width="100%"
              ></app-input>
            </div>

            <div class="col-md-6">
              <app-input
                label="Condemnation Order Number"
                type="text"
                formControlName="condemnationOrderNumber"
                placeholder="Enter order no."
                [required]="true"
                width="100%"
              ></app-input>
            </div>

            <div class="col-12">
              <app-input
                label="Upload Disposal Order"
                type="file"
                accept=".jpg,.jpeg,.png,.pdf"
                (change)="onFileChange($event)"
                width="100%"
              ></app-input>
              <small class="text-muted mt-1 d-block">Max: 5MB (JPG, PNG, PDF)</small>
            </div>

            <div class="col-12">
              <app-input
                label="Reason / Remarks"
                type="textarea"
                formControlName="reason"
                placeholder="Explain the reason for condemnation"
                [required]="true"
                width="100%"
              ></app-input>
            </div>

            <!-- Auction Section -->
            <div class="col-12 mt-4">
              <h6 class="text-primary fw-bold border-bottom pb-2 mb-3">Auction Information (Optional)</h6>
            </div>

            <div class="col-md-4">
              <app-input
                label="Auction Status"
                type="select"
                [options]="auctionStatusOptions"
                formControlName="auctionStatus"
                width="100%"
              ></app-input>
            </div>

            <div class="col-md-4">
              <app-input
                label="Auction Date"
                type="date"
                formControlName="auctionDate"
                width="100%"
              ></app-input>
            </div>

            <div class="col-md-4">
              <app-input
                label="Auction Amount"
                type="number"
                formControlName="auctionAmount"
                placeholder="Enter amount"
                width="100%"
              ></app-input>
            </div>
          </div>
        </div>

        <div class="modal-footer border-0 p-3 bg-light rounded-bottom">
          <app-btn 
            label="Cancel" 
            variant="secondary" 
            type="button" 
            (click)="onClose()"
            [disabled]="isSubmitting()"
          ></app-btn>
          <app-btn 
            label="Confirm Condemnation" 
            variant="danger" 
            type="submit" 
            [isLoading]="isSubmitting()"
            [disabled]="condemnForm.invalid"
          ></app-btn>
        </div>
      </form>
    </div>
  </div>
</div>

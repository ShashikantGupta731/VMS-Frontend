<p-button [type]="type" [label]="label" [icon]="icon || ''" [severity]="primeSeverity" [size]="primeSize"
  [variant]="isOutlined ? 'outlined' : undefined"
  [disabled]="disabled || loading || isLoading" [loading]="loading || isLoading" [styleClass]="customClass" (onClick)="handleClick($event)">
</p-button>

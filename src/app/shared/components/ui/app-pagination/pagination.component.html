<div class="app-pagination" [class]="customClass">
  @if (showInfo) {
    <div class="app-pagination-info">
      <span>Showing {{ startIndex }}-{{ endIndex }} of {{ totalItems }} entries</span>
    </div>
  }
  <div class="app-pagination-controls">
    <button
      class="app-btn btn-sm"
      (click)="onPrevious()"
      [disabled]="currentPage === 1"
    >
      Previous
    </button>
    @for (page of pages; track page) {
      <button
        class="app-btn btn-sm"
        [class.active]="page === currentPage"
        (click)="onPageChange(page)"
      >
        {{ page }}
      </button>
    }
    <button
      class="app-btn btn-sm"
      (click)="onNext()"
      [disabled]="currentPage === totalPages"
    >
      Next
    </button>
  </div>
</div>

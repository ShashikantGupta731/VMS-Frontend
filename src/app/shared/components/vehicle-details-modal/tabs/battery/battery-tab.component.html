  <app-data-table
    [columns]="columns"
    [data]="batteryChanges()"
    [isLoading]="isLoading()"
    [actions]="actions"
    emptyMessage="No Record Found"
  ></app-data-table>
  @if (error()) {
    <div class="error-message">{{ error() }}</div>
  }
  
  <app-document-viewer [(visible)]="viewerVisible" [documentPath]="viewerDocumentPath"></app-document-viewer>

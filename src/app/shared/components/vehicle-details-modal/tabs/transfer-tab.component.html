<app-card>
  <div *ngIf="isLoading">Loading...</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>
  <div *ngIf="transferHistory.length > 0 && !isLoading">
    <div *ngFor="let transfer of transferHistory; let i = index" class="transfer-item">
      <div class="transfer-header">Transfer #{{ i + 1 }}</div>
      <app-key-value-list
        [items]="[
          { label: 'Vehicle Transferred On', value: transfer.vehicleTransferredOn },
          { label: 'Verified On', value: transfer.verifiedOn },
          { label: 'Previous Office', value: transfer.previousOffice },
          { label: 'Previous Department', value: transfer.previousDepartment },
          { label: 'Allocation Type', value: transfer.allocationType },
          { label: 'Officer Name', value: transfer.officerName },
          { label: 'Officer Designation', value: transfer.officerDesignation },
          { label: 'Remarks', value: transfer.remarks, isMultiline: true },
          { label: 'Previous DDO', value: transfer.previousDdo },
          { label: 'New DDO', value: transfer.newDdo }
        ]"
        [columns]="2"
      ></app-key-value-list>
    </div>
  </div>
  <div *ngIf="transferHistory.length === 0 && !isLoading && !error" class="empty-state">
    No Record Found
  </div>
</app-card>

<app-card>
  <!-- Header Section -->
  <div class="models-header">
    <h1 class="page-title">Models</h1>
    <app-btn label="Go back to Home" (click)="onGoBackToHome()" variant="default"></app-btn>
  </div>

  <!-- Table Section -->
  <div class="mb-4">
    <table class="table" *ngIf="!isLoading && models.length > 0">
      <thead>
        <tr>
          <th *ngFor="let column of tableColumns">{{ column.label }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let model of models">
          <td>{{ model.modelName }}</td>
          <td>{{ model.manufacturer }}</td>
          <td>{{ model.seatingCapacity }}</td>
          <td>{{ model.vehicleType }}</td>
        </tr>
      </tbody>
    </table>

    <!-- Empty State -->
    <div *ngIf="!isLoading && models.length === 0" class="empty-state">
      <p>No Record Found</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-state">
      <p>Loading...</p>
    </div>
  </div>

  <!-- Pagination Section -->
  <app-pagination
    *ngIf="models.length > 0"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [totalItems]="totalItems"
    [itemsPerPage]="itemsPerPage"
    (pageChange)="onPageChange($event)"
  ></app-pagination>
</app-card>

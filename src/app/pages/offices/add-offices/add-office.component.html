<app-card>
  <!-- Header Section -->
  <div class="add-office-header">
    <div>
      <h1 class="page-title">Offices</h1>
      <h2 class="sub-heading">Add Office</h2>
    </div>
    <app-btn label="Go back to Home" (click)="onGoBackToHome()" variant="default"></app-btn>
  </div>

  <!-- Form Section -->
  <form [formGroup]="officeForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <!-- Department -->
      <div class="form-field">
        <label for="department">Department *</label>
        <select id="department" formControlName="department" class="form-select">
          <option value="">Select Department</option>
          <option *ngFor="let dept of departments" [value]="dept.value">
            {{ dept.label }}
          </option>
        </select>
        <div
          *ngIf="department?.invalid && department?.touched"
          class="error-message"
        >
          Department is required
        </div>
      </div>

      <!-- Tehsil -->
      <div class="form-field">
        <label for="tehsil">Tehsil</label>
        <select id="tehsil" formControlName="tehsil" class="form-select">
          <option value="">Select Tehsil</option>
          <option *ngFor="let tehsil of tehsils" [value]="tehsil.value">
            {{ tehsil.label }}
          </option>
        </select>
      </div>

      <!-- Office Name -->
      <div class="form-field">
        <label for="officeName">Office Name *</label>
        <input
          id="officeName"
          type="text"
          formControlName="officeName"
          class="form-input"
          placeholder="Enter office name"
        />
        <div
          *ngIf="officeName?.invalid && officeName?.touched"
          class="error-message"
        >
          Office name is required
        </div>
      </div>

      <!-- Office Address -->
      <div class="form-field">
        <label for="officeAddress">Office Address</label>
        <input
          id="officeAddress"
          type="text"
          formControlName="officeAddress"
          class="form-input"
          placeholder="Enter office address"
        />
      </div>

      <!-- Office Abbreviation -->
      <div class="form-field">
        <label for="officeAbbreviation">Office Abbreviation</label>
        <input
          id="officeAbbreviation"
          type="text"
          formControlName="officeAbbreviation"
          class="form-input"
          placeholder="Enter office abbreviation"
        />
      </div>

      <!-- Office Type -->
      <div class="form-field">
        <label for="officeType">Office Type *</label>
        <select id="officeType" formControlName="officeType" class="form-select">
          <option value="">Select Office Type</option>
          <option *ngFor="let type of officeTypes" [value]="type.value">
            {{ type.label }}
          </option>
        </select>
        <div
          *ngIf="officeType?.invalid && officeType?.touched"
          class="error-message"
        >
          Office type is required
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="form-actions">
      <app-btn
        label="Submit"
        (click)="onSubmit()"
        variant="primary"
        [disabled]="isLoading"
      ></app-btn>
      <app-btn
        label="Back"
        (click)="onBack()"
        variant="secondary"
        [disabled]="isLoading"
      ></app-btn>
    </div>
  </form>
</app-card>

<div class="main-layout" [class.sidebar-collapsed]="!isSidebarHidden" [class.sidebar-hidden]="isSidebarHidden">
  <app-header (sidebarToggle)="onSidebarToggle()"></app-header>
  <app-sidebar
    *ngIf="!isSidebarHidden"
    [menuItems]="menuItems"
    [config]="{ position: 'left', collapsed: true, showUserSection: true }"
    [currentUser]="currentUser ? { name: currentUser.name, avatar: undefined } : undefined"
    (toggleCollapse)="onSidebarToggle()"
    (menuItemClick)="onMenuClick($event)"
    (logout)="onLogout()"
    (mouseenter)="onSidebarMouseEnter()"
    (mouseleave)="onSidebarMouseLeave()">
  </app-sidebar>
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

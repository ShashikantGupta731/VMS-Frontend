<app-card title="Secretaries Master">
  <div header-actions>
    <app-btn variant="primary" icon="bx bx-plus" routerLink="/master/secretaries/add">
      Add Secretary
    </app-btn>
  </div>

  <div class="card-body">
    <app-data-table
      [data]="secretaries"
      [columns]="tableColumns"
      [actions]="tableActions"
      [isLoading]="isLoading">

      <!-- Custom template for the Status column -->
      <ng-template #cellTemplate let-col="column" let-row="row">
        <ng-container *ngIf="col.key === 'isActive'">
          <span class="badge" [ngClass]="row.isActive ? 'bg-success' : 'bg-danger'">
            {{ row.isActive ? 'Active' : 'Inactive' }}
          </span>
        </ng-container>
        
        <!-- Default fallback for other columns -->
        <ng-container *ngIf="col.key !== 'isActive'">
          {{ row[col.key] }}
        </ng-container>
      </ng-template>

    </app-data-table>
  </div>
</app-card>

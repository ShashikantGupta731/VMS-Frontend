<app-card [title]="isEditMode ? 'Edit Secretary Details' : 'Add Secretary Details'">
  <form [formGroup]="secretaryForm" (ngSubmit)="onSubmit()" class="card-body">
    <div class="row g-3">
      <!-- Title -->
      <div class="col-md-6">
        <app-input
          id="title"
          label="Title"
          formControlName="title"
          placeholder="e.g. Principal Secretary"
          [maxLength]="200">
        </app-input>
      </div>

      <!-- Email -->
      <div class="col-md-6">
        <app-input
          id="emailId"
          label="Email Address"
          type="email"
          formControlName="emailId"
          placeholder="Enter email address"
          [maxLength]="200">
        </app-input>
      </div>

      <!-- Department -->
      <div class="col-md-6">
        <app-input
          id="department"
          type="select"
          label="Department"
          formControlName="department"
          [options]="departmentOptions">
        </app-input>
      </div>

      <!-- Status (Active/Inactive) -->
      <div class="col-md-6">
        <app-input
          id="isActive"
          type="select"
          label="Status"
          formControlName="isActive"
          [options]="[{label: 'Active', value: true}, {label: 'Inactive', value: false}]">
        </app-input>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-4 d-flex gap-2">
      <app-btn type="submit" variant="primary" icon="bx bx-save" [loading]="isLoading">
        {{ isEditMode ? 'Update Secretary' : 'Save Secretary' }}
      </app-btn>
      <app-btn type="button" variant="outline-secondary" (onClick)="onBack()">
        Cancel
      </app-btn>
    </div>
  </form>
</app-card>

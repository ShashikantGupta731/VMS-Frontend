<div class="models-container">
  <!-- Page Header -->
  <app-card>
  <div class="page-header mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h1 class="page-title h4 fw-bold mb-0">Models</h1>
      </div>
      <app-btn label="← Back" variant="dark-blue" (click)="onGoBackToHome()"></app-btn>
    </div>
  </div>

  
    <!-- Add New Section -->
    @if (isAdmin()) {
      <div class="d-flex justify-content-between align-items-center mb-4">
        <app-btn label="Add New Model" icon="pi pi-plus-circle" variant="primary" (click)="onAddNewModel()"></app-btn>
      </div>
    }

    <!-- Table Section -->
    <div class="table-responsive">
      <app-data-table
        [columns]="tableColumns"
        [data]="paginatedModels()"
        [actions]="tableActions"
        [isLoading]="isLoading()"
        [emptyMessage]="'No models found'"
      ></app-data-table>
    </div>

    <!-- Pagination -->
    @if (allModels().length > 0) {
      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        [itemsPerPage]="itemsPerPage()"
        (pageChange)="onPageChange($event)"
      ></app-pagination>
    }
  </app-card>
</div>

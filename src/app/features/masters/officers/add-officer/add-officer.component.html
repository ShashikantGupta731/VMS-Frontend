<div class="container-fluid p-4">
  <app-card>
    <!-- Header inside the main card -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
      <div>
        <h2 class="mb-1">{{ isEditMode() ? 'Edit Officer' : 'Add New Officer' }}</h2>
        <p class="text-muted mb-0">Enter officer details and set fuel/maintenance limits.</p>
      </div>
      <app-btn variant="dark-blue" (click)="onBack()" label="Back to List">
        <i class="bi bi-arrow-left me-2"></i>
      </app-btn>
    </div>

    <form [formGroup]="officerForm" (ngSubmit)="onSubmit()">
      
      <!-- HRMS & Personal Details -->
      <h6 class="fw-bold mb-3 text-primary">HRMS & Personal Details</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="d-flex gap-2 align-items-end">
            <app-input 
              label="HRMS Code" 
              formControlName="hrmsCode" 
              placeholder="Enter HRMS Code"
              [error]="officerForm.get('hrmsCode')?.touched && officerForm.get('hrmsCode')?.invalid ? 'HRMS Code is required' : ''">
            </app-input>
            <app-btn 
              type="button" 
              variant="dark-blue" 
              (click)="verifyHrms()" 
              [isLoading]="isVerifying()"
              label="Verify">
            </app-btn>
          </div>
        </div>
        <div class="col-md-8">
          <app-input 
            label="Officer Name" 
            formControlName="officerName" 
            placeholder="Full Name"
            [error]="officerForm.get('officerName')?.touched && officerForm.get('officerName')?.invalid ? 'Officer Name is required' : ''">
          </app-input>
        </div>
      </div>

      <hr class="text-muted my-4">

      <!-- Office & Designation -->
      <h6 class="fw-bold mb-3 text-primary">Office & Designation</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <app-input 
            type="select" 
            label="Designation" 
            formControlName="designationId" 
            [options]="designations"
            placeholder="Select Designation"
            [error]="officerForm.get('designationId')?.touched && officerForm.get('designationId')?.invalid ? 'Designation is required' : ''">
          </app-input>
        </div>
        <div class="col-md-6">
          <app-input 
            type="select" 
            label="Office/Department" 
            formControlName="deptId" 
            [options]="offices"
            placeholder="Select Office"
            [error]="officerForm.get('deptId')?.touched && officerForm.get('deptId')?.invalid ? 'Office is required' : ''">
          </app-input>
        </div>
      </div>

      <hr class="text-muted my-4">

      <!-- Limits -->
      <h6 class="fw-bold mb-3 text-primary">Fuel & Maintenance Limits (Overrides)</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <app-input 
            type="number" 
            label="Petrol Fuel Limit (Liters)" 
            formControlName="fuelLimit"
            [error]="officerForm.get('fuelLimit')?.touched && officerForm.get('fuelLimit')?.invalid ? 'Valid limit required' : ''">
          </app-input>
        </div>
        <div class="col-md-3">
          <app-input 
            type="number" 
            label="Diesel Fuel Limit (Liters)" 
            formControlName="fuelLimmitd"
            [error]="officerForm.get('fuelLimmitd')?.touched && officerForm.get('fuelLimmitd')?.invalid ? 'Valid limit required' : ''">
          </app-input>
        </div>
        <div class="col-md-3">
          <app-input 
            type="number" 
            label="Petrol Maint. Limit (₹)" 
            formControlName="maintenanceLimit"
            [error]="officerForm.get('maintenanceLimit')?.touched && officerForm.get('maintenanceLimit')?.invalid ? 'Valid limit required' : ''">
          </app-input>
        </div>
        <div class="col-md-3">
          <app-input 
            type="number" 
            label="Diesel Maint. Limit (₹)" 
            formControlName="maintenanceLimitd"
            [error]="officerForm.get('maintenanceLimitd')?.touched && officerForm.get('maintenanceLimitd')?.invalid ? 'Valid limit required' : ''">
          </app-input>
        </div>
      </div>

      <hr class="text-muted my-4">

      <!-- Remarks -->
      <h6 class="fw-bold mb-3 text-primary">Other Details</h6>
      <div class="row g-3 mb-4">
        <div class="col-md-12">
          <app-input 
            type="textarea" 
            label="Remarks" 
            formControlName="remarks" 
            placeholder="Any additional information...">
          </app-input>
        </div>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
        <app-btn type="button" variant="dark-blue" (click)="onBack()" label="Cancel"></app-btn>
        <app-btn type="submit" variant="dark-blue" [isLoading]="isLoading()" [label]="isEditMode() ? 'Update Officer' : 'Save Officer'">
        </app-btn>
      </div>

    </form>
  </app-card>
</div>

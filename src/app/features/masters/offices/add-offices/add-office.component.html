<app-card>
  <!-- Header Section -->
  <div class="add-office-header">
    <div>
      <h1 class="page-title">Offices</h1>
      <h2 class="sub-heading">{{ isEditMode ? 'Edit Office' : 'Add Office' }}</h2>
    </div>
    <app-btn label="← Back" (click)="onBack()" variant="dark-blue"></app-btn>
  </div>

  <!-- Form Section -->
  <form [formGroup]="officeForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <!-- Department -->
      <app-input
        type="select"
        label="Department"
        formControlName="department"
        [options]="departmentOptions"
        placeholder="Select Department"
        [required]="true"
        [error]="department?.touched && department?.invalid ? 'Department is required' : ''">
      </app-input>

      <!-- District -->
      <app-input
        type="select"
        label="District"
        formControlName="district"
        [options]="districtOptions"
        placeholder="Select District"
        [required]="true"
        (change)="onDistrictChange()"
        [error]="district?.touched && district?.invalid ? 'District is required' : ''">
      </app-input>

      <!-- Tehsil -->
      <app-input
        type="select"
        label="Tehsil"
        formControlName="tehsil"
        [options]="tehsilOptions"
        placeholder="Select Tehsil"
        [required]="true"
        [error]="tehsil?.touched && tehsil?.invalid ? 'Tehsil is required' : ''">
      </app-input>

      <!-- Office Name -->
      <app-input
        label="Office Name"
        formControlName="officeName"
        placeholder="Enter office name"
        [required]="true"
        [error]="officeName?.touched && officeName?.invalid ? 'Office name is required' : ''">
      </app-input>

      <!-- Office Address -->
      <app-input
        label="Office Address"
        formControlName="officeAddress"
        placeholder="Enter office address"
        [required]="true"
        [error]="officeAddress?.touched && officeAddress?.invalid ? 'Office address is required' : ''">
      </app-input>

      <!-- Office Abbreviation -->
      <app-input
        label="Office Abbreviation"
        formControlName="officeAbbreviation"
        placeholder="Enter office abbreviation"
        [required]="true"
        [error]="officeAbbreviation?.touched && officeAbbreviation?.invalid ? 'Office abbreviation is required' : ''">
      </app-input>

      <!-- Office Type -->
      <app-input
        type="select"
        label="Office Type"
        formControlName="officeType"
        [options]="officeTypeOptions"
        placeholder="Select Office Type"
        [required]="true"
        [error]="officeType?.touched && officeType?.invalid ? 'Office type is required' : ''">
      </app-input>

      <!-- Other Office Type (shown only when "Other" is selected) -->
      @if (showOtherOfficeType) {
        <app-input
          label="Other Office Type"
          formControlName="officeTypeOther"
          placeholder="Please specify office type"
          [required]="true"
          [error]="officeTypeOther?.touched && !officeTypeOther?.value?.trim() ? 'Office type details are required' : ''">
        </app-input>
      }
    </div>

    <!-- Action Buttons -->
    <div class="form-actions">
      <app-btn
        [label]="isLoading ? 'Saving...' : (isEditMode ? 'Update' : 'Submit')"
        (click)="onSubmit()"
        variant="dark-blue"
        [disabled]="isLoading"
      ></app-btn>
      <app-btn
        label="Back"
        (click)="onBack()"
        variant="outline-secondary"
        [disabled]="isLoading"
      ></app-btn>
    </div>
  </form>
</app-card>

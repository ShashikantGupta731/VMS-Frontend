<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">Projects Management</h2>
      <p class="text-muted mb-0">View and manage departmental projects and budget heads.</p>
    </div>
    <div class="d-flex gap-2">
      <app-btn variant="dark-blue" size="sm" (click)="onGoBackToHome()" label="Back to Dashboard" icon="pi pi-arrow-left"></app-btn>
      <app-btn variant="dark-blue" size="sm" icon="pi pi-plus-circle" (click)="onAddNewProject()" label="Add New Project"></app-btn>
    </div>
  </div>

  <app-card>
    <div class="p-3">
      <app-data-table 
        [columns]="tableColumns" 
        [data]="paginatedProjects()" 
        [isLoading]="isLoading()"
        [actions]="tableActions">
      </app-data-table>

      <div class="mt-4 d-flex justify-content-center" *ngIf="totalPages() > 1">
        <app-pagination 
          [currentPage]="currentPage()" 
          [totalPages]="totalPages()" 
          (pageChange)="onPageChange($event)">
        </app-pagination>
      </div>
    </div>
  </app-card>
</div>

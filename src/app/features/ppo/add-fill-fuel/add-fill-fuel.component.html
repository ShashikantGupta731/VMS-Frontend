<div class="dashboard-container">
  <app-card customClass="no-padding">
    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <div>
        <h1 class="fs-4 fw-bold text-secondary mb-0">Fill Fuel</h1>
      </div>
      <div>
        <a routerLink="/ppo" class="text-primary text-decoration-none" style="font-size: 0.9rem;">Go back to Home</a>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row px-2">
        <!-- Row 1 -->
        <div class="col-md-6 mb-4">
          <div class="d-flex align-items-end gap-2">
            <div class="flex-grow-1">
              <app-input
                label="Vehicle Number"
                type="text"
                formControlName="vehicleNumber"
                placeholder="Vehicle Number"
                [required]="true"
                width="100%"
                [disabled]="true"
              ></app-input>
            </div>
            <app-btn customClass="p-button-rounded px-4 search-vehicle-btn" (click)="openModal()" label="Search Vehicle" icon="pi pi-search"></app-btn>
          </div>
          <div *ngIf="getErrorMessage('vehicleNumber')" class="text-danger error-message">
            {{getErrorMessage('vehicleNumber')}}
          </div>
        </div>
        
        <div class="col-md-6 mb-4">
          <app-input
            label="DDO Code"
            type="text"
            formControlName="ddoCode"
            placeholder="DDO Code"
            width="100%"
            [disabled]="true"
          ></app-input>
        </div>

        <!-- Row 2 -->
        <div class="col-md-6 mb-4">
          <app-input
            label="Fuel Type"
            type="select"
            [options]="inventoryOptions"
            formControlName="inventoryType"
            placeholder="Select Fuel Type"
            [required]="true"
            width="100%"
          ></app-input>
          <div *ngIf="getErrorMessage('inventoryType')" class="text-danger error-message mt-1">
            {{getErrorMessage('inventoryType')}}
          </div>
        </div>

        <div class="col-md-6 mb-4">
          <app-input
            label="Available Fuel (Litres)"
            type="text"
            formControlName="availableFuel"
            placeholder="Available Fuel (Litres)"
            width="100%"
            [disabled]="true"
          ></app-input>
        </div>

        <!-- Row 3 -->
        <div class="col-md-6 mb-4">
          <app-input
            label="Fuel Filled Quantity (in Litres)"
            type="number"
            formControlName="litres"
            placeholder="Fuel Filled Quantity (in Litres)"
            [required]="true"
            width="100%"
          ></app-input>
          <div *ngIf="getErrorMessage('litres')" class="text-danger fw-bold mt-1">
            {{getErrorMessage('litres')}}
          </div>
        </div>

        <div class="col-md-6 mb-4">
          <app-input
            label="Date of Filling"
            type="date"
            formControlName="dateOfAllowance"
            [required]="true"
            width="100%"
          ></app-input>
          <div *ngIf="getErrorMessage('dateOfAllowance')" class="text-danger error-message mt-1">
            {{getErrorMessage('dateOfAllowance')}}
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <app-btn label="← Back" variant="dark-blue" size="sm" routerLink="/ppo"></app-btn>
        <div class="d-flex align-items-center gap-2">
          <app-btn label="Save Fuel Entry" variant="dark-blue" size="sm" type="submit"
            [disabled]="form.invalid || isSubmitting" icon="pi pi-save" [isLoading]="isSubmitting"></app-btn>
        </div>
      </div>
    </form>
  </app-card>
</div>

<!-- Vehicle Search Modal -->
<div class="modal fade" [class.show]="showModal" [class.d-block]="showModal" tabindex="-1" [style.background]="showModal ? 'rgba(0,0,0,0.5)' : 'none'">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Select Vehicle Number</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-3">
          <div class="col-md-9">
            <input type="text" placeholder="Enter Vehicle Number to search" class="form-control" [(ngModel)]="searchQuery" [ngModelOptions]="{standalone: true}">
          </div>
          <div class="col-md-3">
            <app-btn variant="dark-blue" customClass="w-100" (click)="searchVehicles()" [isLoading]="isSearching" label="Search"></app-btn>
          </div>
        </div>
        
        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
          <table class="table table-striped table-hover border">
            <thead class="table-light sticky-top">
              <tr>
                <th scope="col" style="width: 10%">#</th>
                <th scope="col" style="width: 60%">Vehicle No.</th>
                <th scope="col" class="text-center" style="width: 30%">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of vehicleList; let i=index">
                <th scope="row" class="align-middle">{{ i + 1 }}</th>
                <td class="align-middle fw-bold">{{data.vehicleNumber}}</td>
                <td class="text-center">
                  <app-btn size="sm" variant="dark-blue" customClass="px-4" (click)="selectVehicle(data)" label="Select"></app-btn>
                </td>
              </tr>
              <tr *ngIf="vehicleList.length === 0 && !isSearching" class="text-center text-muted">
                <td colspan="3" class="py-4">No Vehicles Found. Enter a query and click Search.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

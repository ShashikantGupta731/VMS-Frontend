<div class="p-4">
  <app-card customClass="mx-auto" style="max-width: 600px;">
    <h2 class="h4 fw-bold mb-4">Add Inventory Stock</h2>
    
    <form [formGroup]="stockForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <app-input
          type="select"
          label="Inventory Item"
          formControlName="itemId"
          [options]="itemOptions"
          placeholder="Select Item"
          [required]="true"
          [error]="stockForm.get('itemId')?.touched && stockForm.get('itemId')?.invalid ? 'Item is required.' : ''">
        </app-input>
      </div>

      <div class="mb-3">
        <app-input
          type="number"
          label="Quantity"
          formControlName="quantity"
          placeholder="Enter quantity"
          [required]="true"
          [error]="stockForm.get('quantity')?.touched && stockForm.get('quantity')?.invalid ? 'Quantity must be at least 1.' : ''">
        </app-input>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <app-input
            label="Bill Number"
            formControlName="billNo"
            placeholder="Bill No.">
          </app-input>
        </div>
        <div class="col-md-6">
          <app-input
            type="date"
            label="Bill Date"
            formControlName="billDate">
          </app-input>
        </div>
      </div>

      <div class="mb-4">
        <app-input
          type="textarea"
          label="Remarks"
          formControlName="remarks"
          placeholder="Additional notes...">
        </app-input>
      </div>

      <div class="d-flex gap-2">
        <app-btn [label]="'Save Stock'" [type]="'submit'" [disabled]="stockForm.invalid" [loading]="isSubmitting()"
          [customClass]="'flex-grow-1 neumorphic-btn'"></app-btn>
        <app-btn [label]="'Cancel'" [routerLink]="'/inventory'" [variant]="'secondary'"
          [customClass]="'neumorphic-btn-secondary'"></app-btn>
      </div>
    </form>
  </app-card>
</div>

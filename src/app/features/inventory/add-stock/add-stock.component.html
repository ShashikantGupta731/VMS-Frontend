<div class="p-4">
  <div class="card neumorphic-card border-0 p-4 mx-auto" style="max-width: 600px;">
    <h2 class="h4 fw-bold mb-4">Add Inventory Stock</h2>
    
    <form [formGroup]="stockForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Inventory Item</label>
        <select class="form-select pill-input" formControlName="itemId">
          <option value="">Select Item</option>
          @for (item of items(); track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Quantity</label>
        <input type="number" class="form-control pill-input" formControlName="quantity" placeholder="Enter quantity" />
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Bill Number</label>
          <input type="text" class="form-control pill-input" formControlName="billNo" placeholder="Bill No." />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Bill Date</label>
          <input type="date" class="form-control pill-input" formControlName="billDate" />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Remarks</label>
        <textarea class="form-control pill-input" formControlName="remarks" rows="3" placeholder="Additional notes..."></textarea>
      </div>

      <div class="d-flex gap-2">
        <app-btn [label]="'Save Stock'" [type]="'submit'" [disabled]="stockForm.invalid" [loading]="isSubmitting()"
          [customClass]="'flex-grow-1 neumorphic-btn'"></app-btn>
        <app-btn [label]="'Cancel'" [routerLink]="'/inventory'" [variant]="'secondary'"
          [customClass]="'neumorphic-btn-secondary'"></app-btn>
      </div>
    </form>
  </div>
</div>

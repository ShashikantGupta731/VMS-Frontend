<div class="p-4">
  <app-card customClass="mx-auto" style="max-width: 600px;">
    <h2 class="h4 fw-bold mb-4">Allot Inventory Item</h2>

    <form [formGroup]="allotForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <app-input
          type="select"
          label="Select Vehicle"
          formControlName="vehicleId"
          [options]="vehicleOptions"
          placeholder="Choose Vehicle"
          [required]="true"
          [error]="allotForm.get('vehicleId')?.touched && allotForm.get('vehicleId')?.invalid ? 'Vehicle is required.' : ''">
        </app-input>
      </div>

      <div class="mb-3">
        <app-input
          type="select"
          label="Inventory Item"
          formControlName="itemId"
          [options]="itemOptions"
          placeholder="Select Item"
          [required]="true"
          [error]="allotForm.get('itemId')?.touched && allotForm.get('itemId')?.invalid ? 'Item is required.' : ''">
        </app-input>
        @if (availableStock() !== null) {
          <div class="mt-1 small" [class.text-danger]="availableStock() === 0" [class.text-success]="availableStock()! > 0">
            Available Stock: {{ availableStock() }}
          </div>
        }
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <app-input
            type="number"
            label="Quantity"
            formControlName="quantity"
            [required]="true"
            [error]="allotForm.get('quantity')?.touched && allotForm.get('quantity')?.invalid ? 'Quantity must be at least 1.' : ''">
          </app-input>
        </div>
        <div class="col-md-6">
          <app-input
            label="Odometer Reading"
            formControlName="odometer"
            placeholder="Current Odometer">
          </app-input>
        </div>
      </div>

      <div class="mb-4">
        <app-input
          type="textarea"
          label="Remarks"
          formControlName="remarks"
          placeholder="Reason for allotment...">
        </app-input>
      </div>

      <div class="d-flex gap-2">
        <app-btn [label]="'Confirm Allotment'" [type]="'submit'" [disabled]="allotForm.invalid || (availableStock() || 0) < allotForm.get('quantity')?.value" 
          [loading]="isSubmitting()" [customClass]="'flex-grow-1 neumorphic-btn'"></app-btn>
        <app-btn [label]="'Cancel'" [routerLink]="'/inventory'" [variant]="'secondary'"
          [customClass]="'neumorphic-btn-secondary'"></app-btn>
      </div>
    </form>
  </app-card>
</div>

<div class="maintenance-vouchers-container">
  <app-card>
    <!-- Page Header -->
    <div class="page-header mb-4">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h1 class="page-title h4 fw-bold mb-0">Maintenance Vouchers</h1>
        </div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a [routerLink]="['/vehicle']">Vehicle</a></li>
            <li class="breadcrumb-item active" aria-current="page">Maintenance Vouchers</li>
          </ol>
        </nav>
      </div>
    </div>

    <!-- Top Action Section -->
    <div class="d-flex justify-content-end mb-4">
      <app-btn label="Create New Maintenance Voucher" variant="primary" (click)="createNewVoucher()"></app-btn>
    </div>

    <!-- Section Title -->
    <h5 class="section-title mb-3">Drafted Vouchers</h5>

    <!-- Table Section -->
    <div class="table-responsive">
      <app-data-table
        [columns]="tableColumns"
        [data]="getPaginatedVouchers()"
        [actions]="tableActions"
        [isLoading]="vouchersResource.isLoading()"
        [emptyMessage]="'No Drafted Vouchers Found'"
      ></app-data-table>
    </div>

    <!-- Error State -->
    @if (vouchersResource.error()) {
      <div class="alert alert-danger mt-3">
        Failed to load maintenance vouchers. Please try again later.
      </div>
    }

    <!-- Pagination -->
    <app-pagination
      *ngIf="totalItems > 0"
      [currentPage]="currentPage"
      [totalPages]="totalPagesCount"
      [totalItems]="totalItems"
      [itemsPerPage]="itemsPerPage"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </app-card>
</div>

<div class="billing-dashboard p-4">
  <div class="page-header d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold mb-0">Billing & Vouchers Dashboard</h1>
  </div>

  <!-- Stats Cards (Clickable Filters) -->
  <div class="row g-3 mb-4">

    <!-- All Claims -->
    <div class="col-md-3">
      <div class="stat-card stat-card--primary filter-card" [class.active]="activeFilter() === 'all'"
        (click)="activeFilter.set('all')">
        <div class="stat-card__icon-wrap">
          <i class="pi pi-list"></i>
        </div>
        <div class="stat-card__content">
          <span class="stat-card__label">All Claims</span>
          <span class="stat-card__value">{{ totalCount() }}</span>
        </div>
      </div>
    </div>

    <!-- Pending Verification -->
    <div class="col-md-3">
      <div class="stat-card stat-card--warning filter-card" [class.active]="activeFilter() === BillStatus.Pending"
        (click)="activeFilter.set(BillStatus.Pending)">
        <div class="stat-card__icon-wrap">
          <i class="pi pi-clock"></i>
        </div>
        <div class="stat-card__content">
          <span class="stat-card__label">Pending Verification</span>
          <span class="stat-card__value">{{ pendingCount() }}</span>
        </div>
      </div>
    </div>

    <!-- Verified Claims -->
    <div class="col-md-3">
      <div class="stat-card stat-card--success filter-card" [class.active]="activeFilter() === BillStatus.Verified"
        (click)="activeFilter.set(BillStatus.Verified)">
        <div class="stat-card__icon-wrap">
          <i class="pi pi-check-circle"></i>
        </div>
        <div class="stat-card__content">
          <span class="stat-card__label">Verified Claims</span>
          <span class="stat-card__value">{{ verifiedCount() }}</span>
        </div>
      </div>
    </div>

    <!-- Rejected Claims -->
    <div class="col-md-3">
      <div class="stat-card stat-card--danger filter-card" [class.active]="activeFilter() === BillStatus.Rejected"
        (click)="activeFilter.set(BillStatus.Rejected)">
        <div class="stat-card__icon-wrap">
          <i class="pi pi-times-circle"></i>
        </div>
        <div class="stat-card__content">
          <span class="stat-card__label">Rejected Claims</span>
          <span class="stat-card__value">{{ rejectedCount() }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Recent Claims Table -->
  <app-card title="Recent Bill Claims">
    <div class="table-container mt-2">
      <app-data-table [columns]="tableColumns" [data]="filteredClaims()" [actions]="tableActions"
        [isLoading]="claimsResource.isLoading()"
        [emptyMessage]="'No claims found. Start by creating a new bill.'"></app-data-table>
    </div>
  </app-card>
</div>

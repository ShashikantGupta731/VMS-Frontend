<div class="billing-dashboard p-4">
  <div class="page-header d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold mb-0">Billing & Vouchers Dashboard</h1>
  </div>

  <!-- Stats Cards -->
  <div class="row g-4 mb-4">
    <div class="col-md-4">
      <app-card class="h-100">
        <div class="d-flex align-items-center">
          <div class="stats-icon bg-warning-subtle text-warning me-3">
            <i class="pi pi-clock fs-4"></i>
          </div>
          <div>
            <h6 class="text-muted mb-1">Pending Verification</h6>
            <h3 class="fw-bold mb-0">{{ pendingCount() }}</h3>
          </div>
        </div>
      </app-card>
    </div>
    <div class="col-md-4">
      <app-card class="h-100">
        <div class="d-flex align-items-center">
          <div class="stats-icon bg-success-subtle text-success me-3">
            <i class="pi pi-check-circle fs-4"></i>
          </div>
          <div>
            <h6 class="text-muted mb-1">Total Verified Claims</h6>
            <h3 class="fw-bold mb-0">{{ verifiedCount() }}</h3>
          </div>
        </div>
      </app-card>
    </div>
    <div class="col-md-4">
      <app-card class="h-100">
        <div class="d-flex align-items-center">
          <div class="stats-icon bg-danger-subtle text-danger me-3">
            <i class="pi pi-times-circle fs-4"></i>
          </div>
          <div>
            <h6 class="text-muted mb-1">Rejected Claims</h6>
            <h3 class="fw-bold mb-0">{{ rejectedCount() }}</h3>
          </div>
        </div>
      </app-card>
    </div>
  </div>

  <!-- Recent Claims Table -->
  <app-card title="Recent Bill Claims">
    <div class="table-container mt-2">
      <app-data-table
        [columns]="tableColumns"
        [data]="claimsResource.value() ?? []"
        [actions]="tableActions"
        [isLoading]="claimsResource.isLoading()"
        [emptyMessage]="'No claims found. Start by creating a new bill.'"
      ></app-data-table>
    </div>
  </app-card>
</div>

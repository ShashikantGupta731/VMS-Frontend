<div class="dashboard-container p-4">
  <app-card customClass="shadow-sm">
    <!-- Page Header -->
    <div class="page-header mb-4 pb-3 border-bottom">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h1 class="page-title h4 fw-bold text-dark mb-0">Amount deposited against Condemned Vehicle</h1>
        </div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a [routerLink]="['/vehicle']">Vehicle</a></li>
            <li class="breadcrumb-item active" aria-current="page">Amount deposited against Condemned Vehicle</li>
          </ol>
        </nav>
      </div>
    </div>

    <form [formGroup]="grnForm" (ngSubmit)="onSubmit()" class="pt-0">
      <div class="row g-4">
        
        <div class="col-md-4">
          <div class="mb-3">
            <label class="form-label fw-semibold">Condemned Vehicle Registration No.</label>
            <select class="form-select form-control" formControlName="oldVehicleNumber" (change)="onCondemnedVehicleChange()">
              <option value="">Select</option>
              <option *ngFor="let v of markedVehicles" [value]="v.registrationNumber">{{ v.registrationNumber }}</option>
            </select>
          </div>
        </div>

        <div class="col-md-4">
          <app-input
            label="Condemned Vehicle Chassis No."
            type="text"
            formControlName="condemnedChassisNo"
            placeholder="Condemned Vehicle Chassis No."
            width="100%"
            [disabled]="true"
          ></app-input>
        </div>

        <div class="col-md-4">
          <app-input
            label="New Vehicle Registration No."
            type="text"
            formControlName="newVehicleRegNo"
            placeholder="New Vehicle Registration No."
            width="100%"
            [disabled]="true"
          ></app-input>
        </div>

        <div class="col-md-4">
          <app-input
            label="New Vehicle Chassis No."
            type="text"
            formControlName="newVehicleChassisNo"
            placeholder="New Vehicle Chassis No."
            width="100%"
            [disabled]="true"
          ></app-input>
        </div>

        <div class="col-md-4 d-flex flex-column">
          <label class="form-label fw-semibold mb-2">Is GRN/Challan No. older than April 2020?</label>
          <div class="radio-group mt-1">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="isOldGrn" [value]="true" id="oldGrnYes">
              <label class="form-check-label" for="oldGrnYes">Yes</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="isOldGrn" [value]="false" id="oldGrnNo">
              <label class="form-check-label" for="oldGrnNo">No</label>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <app-input
            label="GRN No."
            type="text"
            formControlName="grnNumber"
            placeholder="GRN No."
            width="100%"
          ></app-input>
        </div>

        <div class="col-md-4">
          <app-input
            label="GRN Date"
            type="date"
            formControlName="grnDate"
            width="100%"
          ></app-input>
        </div>

        <div class="col-md-4">
          <app-input
            label="GRN Amount"
            type="number"
            formControlName="grnBillAmount"
            placeholder="GRN Amount"
            width="100%"
          ></app-input>
        </div>

        <div class="col-md-4">
          <app-input
            label="Amount For Selected Vehicle"
            type="number"
            formControlName="amountForSelectedVehicle"
            placeholder="Amount For Selected Vehicle"
            width="100%"
          ></app-input>
        </div>

        <div class="col-md-12 d-flex flex-column mt-4">
          <label class="form-label fw-semibold mb-2">Have you entered all GRNs (Full Amount)?</label>
          <div class="radio-group mt-1">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="haveYouEnteredAllGRNsFullAmount" [value]="true" id="allGrnYes">
              <label class="form-check-label" for="allGrnYes">Yes</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="haveYouEnteredAllGRNsFullAmount" [value]="false" id="allGrnNo">
              <label class="form-check-label" for="allGrnNo">No</label>
            </div>
          </div>
        </div>

      </div>

      <div class="mt-5 text-end border-top pt-4">
        <app-btn label="Back" type="button" variant="outline-secondary" class="me-2" (onClick)="goBack()"></app-btn>
        <app-btn label="Submit" type="submit" variant="dark-blue" [disabled]="isLoading"></app-btn>
      </div>
    </form>
  </app-card>
</div>

<div class="dashboard-container p-4">
  <app-card customClass="shadow-sm">
    <!-- Page Header -->
    <div class="page-header mb-4 pb-3 border-bottom">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h1 class="page-title h4 fw-bold text-dark mb-0">Vehicle purchased against Condemned Vehicle</h1>
        </div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a [routerLink]="['/vehicle']">Vehicle</a></li>
            <li class="breadcrumb-item active" aria-current="page">Vehicle purchased against Condemned Vehicle</li>
          </ol>
        </nav>
      </div>
    </div>

    <form [formGroup]="replacementForm" (ngSubmit)="onSubmit()" class="pt-0">

      <p class="fw-bold mb-4 text-dark">PB11BU6810, PB65H9107, PB65H9056, PB65AA8319,</p>

      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <app-input label="New Vehicle Registration No." type="text" formControlName="newVehicleRegNo"
            placeholder="Search Vehicle Number..." width="100%"></app-input>
        </div>
        <div class="col-md-4">
          <app-input label="New Vehicle Chassis No." type="text" formControlName="newVehicleChassisNo"
            placeholder="New Vehicle Chassis No." width="100%" [disabled]="true"></app-input>
        </div>
        <div class="col-md-4">
          <app-input label="Upload FD Approval (.jpg/.jpeg/.png/.pdf)" type="file" accept=".jpg,.jpeg,.png,.pdf"
            (change)="onFileChange($event)" width="100%"></app-input>
        </div>
      </div>

      <div class="mt-4">
        <h6 class="text-dark-blue fw-bold mb-3">Condemned Vehicle Registration No. -</h6>
        <div class="row g-4">
          <div class="col-md-4">
            <app-input label="Condemned Vehicle Registration No." type="select" formControlName="condemnedVehicleRegNo"
              [options]="condemnedVehicleOptions" (change)="onCondemnedVehicleChange()" width="100%"></app-input>
          </div>
          <div class="col-md-4">
            <app-input label="Condemned Vehicle Chassis No." type="text" formControlName="condemnedVehicleChassisNo"
              placeholder="CONDEMNED VEHICLE ENGINE CHASSIS NO." width="100%" [disabled]="true"></app-input>
          </div>
        </div>
      </div>

      <div class="mt-5 text-end border-top pt-4">
        <app-btn label="Back" type="button" variant="outline-secondary" class="me-2" (onClick)="goBack()"></app-btn>
        <app-btn label="Submit" type="submit" variant="dark-blue" [disabled]="isLoading"></app-btn>
      </div>
    </form>
  </app-card>
</div>

<div class="dashboard-container">
  <app-card customClass="no-padding">
    <div class="page-header d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 pb-2 mb-2 border-bottom px-4 pt-4">
      <div>
        <h1 class="page-title m-0 fs-24 fw-bold">Mark for Condemned By FD</h1>
      </div>
      <div class="mt-2 mt-md-0">
        <app-btn variant="outline-primary" routerLink="/reports" size="sm">Back</app-btn>
      </div>
    </div>

    <div class="search-section px-4 pb-2">
      <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="form-row align-items-end d-flex gap-3">
          <div class="form-group flex-grow-1 mb-0">
            <app-input
              label="Vehicle Registration No"
              formControlName="vehicleNumber"
              placeholder="Vehicle Registration Number"
              [error]="searchForm.get('vehicleNumber')?.touched && searchForm.get('vehicleNumber')?.invalid ? 'Vehicle Number is required' : ''"
            ></app-input>
          </div>
          <div class="form-actions mb-0 pb-1">
            <app-btn
              type="submit"
              variant="dark-blue"
              [loading]="isLoading"
              [disabled]="isLoading"
              label="Search"
            >
            </app-btn>
          </div>
        </div>
      </form>
    </div>

    <div class="mb-4 position-relative px-4">
      <div *ngIf="isLoading" class="table-loading-overlay">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <app-data-table 
        [columns]="tableColumns" 
        [data]="tableData" 
        [actions]="tableActions"
        emptyMessage="No Record Found">
      </app-data-table>
    </div>
  </app-card>

  <app-document-viewer [(visible)]="viewerVisible" [documentPath]="viewerDocumentPath"></app-document-viewer>
</div>

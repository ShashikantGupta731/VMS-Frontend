<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 text-primary">Update Vehicle & Driver Details</h4>
  </div>

  <app-card title="Edit Driver Details">
    <form [formGroup]="form">
      <!-- Vehicle Details Section -->
      <h6 class="text-primary mb-3">Vehicle Details</h6>
      <hr>
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <app-input
            label="Vehicle Number"
            formControlName="vehiclenumber"
            placeholder="Vehicle Number"
            [required]="true">
          </app-input>
        </div>

        <div class="col-md-3">
          <label class="form-label">Registration Type <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="RegistrationType" [class.is-invalid]="form.get('RegistrationType')?.invalid && form.get('RegistrationType')?.touched">
            <option [value]="true">Permanent</option>
            <option [value]="false">Temporary</option>
          </select>
          <div class="invalid-feedback" *ngIf="form.get('RegistrationType')?.invalid && form.get('RegistrationType')?.touched">
            Registration Type is required
          </div>
        </div>

        <div class="col-md-3">
          <label class="form-label">Current Status <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="currentstatus" [class.is-invalid]="form.get('currentstatus')?.invalid && form.get('currentstatus')?.touched">
            <option value="" disabled>Select Current Status</option>
            <option value="In Use">In Use</option>
            <option value="Condemned">Condemned</option>
            <option value="Not In Use">Not In Use</option>
            <option value="Marked for Condemned by FD" disabled>Marked for Condemned by FD</option>
          </select>
          <div class="invalid-feedback" *ngIf="form.get('currentstatus')?.invalid && form.get('currentstatus')?.touched">
            Current Status is required
          </div>
        </div>

        <div class="col-md-3" *ngIf="isCondemnedStatus">
          <app-input
            type="date"
            label="Condemned Vehicle Date"
            formControlName="UpdatedDate"
            [maxDate]="todayDate"
            [required]="true">
          </app-input>
        </div>
      </div>

      <!-- Driver Details Section -->
      <h6 class="text-primary mb-3">Driver Details</h6>
      <hr>
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <app-input
            label="Driver Name"
            formControlName="drivername"
            placeholder="Enter Driver Name"
            [required]="true">
          </app-input>
        </div>

        <div class="col-md-4">
          <label class="form-label">Driver Type <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="drivertype" [class.is-invalid]="form.get('drivertype')?.invalid && form.get('drivertype')?.touched">
            <option value="" disabled>Select Driver Type</option>
            <option value="Regular">Regular</option>
            <option value="Contractor">Contractor</option>
            <option value="Outsourced">Outsourced</option>
            <option value="Driven by Non-Driver">Driven by Non-Driver</option>
            <option value="Daily Wages">Daily Wages</option>
          </select>
          <div class="invalid-feedback" *ngIf="form.get('drivertype')?.invalid && form.get('drivertype')?.touched">
            Driver Type is required
          </div>
        </div>

        <div class="col-md-4">
          <app-input
            label="Driver Contact Number"
            formControlName="drivercontact"
            placeholder="Enter Contact Number"
            [required]="true">
          </app-input>
        </div>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-end gap-2 mt-4">
        <app-btn label="Cancel" variant="outline-secondary" routerLink="/vehicle"></app-btn>
        <app-btn label="Save and Update" variant="primary" (click)="onUpdate()" [disabled]="form.invalid"></app-btn>
      </div>
    </form>
  </app-card>
</div>

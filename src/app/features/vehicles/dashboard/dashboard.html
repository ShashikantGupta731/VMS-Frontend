<div class="dashboard-container">
  <app-card customClass="no-padding">
      <!-- Header Section -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 pb-4 mb-4 border-bottom">
        <div>
          <h1 class="fs-28 fw-bold text-dark mb-1">Vehicle Management System</h1>
          <h2 class="fs-18 fw-semibold text-custom-primary m-0">Vehicles</h2>
        </div>
        <div class="mt-2 mt-md-0">
          <app-input type="text" placeholder="Search vehicles..." width="300px"></app-input>
        </div>
      </div>

      <!-- Action Buttons Section -->
      <div class="d-flex flex-column flex-md-row flex-wrap gap-3 mb-4">
        <app-btn label="Add Vehicle" routerLink="/vehicles/add" variant="dark-blue"></app-btn>
        <app-dropdown
          label="Bill Vouchers"
          [items]="billVoucherItems"
          (select)="onBillVoucherSelect($event)"
        ></app-dropdown>
        <app-btn label="Send Bills to IFMS" routerLink="/bill-integration" variant="dark-blue"></app-btn>
        <app-btn label="Treasury (IFMS) Claims" routerLink="/ifms-claims" variant="dark-blue"></app-btn>
        <app-btn label="Verify Vehicle" routerLink="/verify-vehicles" variant="dark-blue"></app-btn>
        <app-dropdown
          label="Download Vehicle list"
          [items]="downloadItems"
          (select)="onDownloadSelect($event)"
        ></app-dropdown>
      </div>

      <!-- Vehicle List Table -->
      <div class="mb-4 position-relative">
        @if (isLoading()) {
          <div class="table-loading-overlay">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        }
        <app-data-table 
          [columns]="tableColumns" 
          [data]="tableData()" 
          [actions]="tableActions">
        </app-data-table>
      </div>

      <!-- Pagination Section -->
      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        [itemsPerPage]="itemsPerPage"
        (pageChange)="onPageChange($event)"
      ></app-pagination>
  </app-card>

  <!-- Vehicle Details Modal -->
  <app-vehicle-details-modal
    [vehicleNumber]="selectedVehicleNumber"
    [isVisible]="showVehicleDetailsModal"
    (close)="closeVehicleDetailsModal()"
  ></app-vehicle-details-modal>

  <!-- Vehicle Transfer Modal -->
  <app-vehicle-transfer-modal
    *ngIf="showTransferModal"
    [vehicle]="selectedVehicleForTransfer"
    (close)="closeTransferModal()"
    (success)="onTransferSuccess()"
  ></app-vehicle-transfer-modal>

  <!-- Vehicle Condemnation Modal -->
  <app-vehicle-condemnation-modal
    *ngIf="showCondemnationModal"
    [vehicle]="selectedVehicleForCondemnation"
    (close)="closeCondemnationModal()"
    (success)="onCondemnSuccess()"
  ></app-vehicle-condemnation-modal>
</div>

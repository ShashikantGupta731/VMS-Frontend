<div class="non-treasury-claims-container">
  <!-- Page Header -->
  <app-card>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="page-title h4 fw-bold mb-0">Non-Treasury Claims</h1>
      </div>
      <app-btn label="← Go back to Home" routerLink="/vehicle" variant="secondary"></app-btn>
    </div>


    <!-- Single Card for Filters and Table -->
    <div customClass="no-padding">
      <form [formGroup]="claimsForm">
        <div class="row">
          <div class="col-md-6 col-lg-3">
            <div class="mb-3">
              <app-input label="Financial Year" type="select" [options]="financialYearOptions"
                formControlName="financialYear" placeholder="Select Year"></app-input>
            </div>
          </div>

          <div class="col-md-6 col-lg-3">
            <div class="mb-3">
              <app-input label="Claim Type" type="select" [options]="claimTypeOptions" formControlName="claimType"
                placeholder="Select Type"></app-input>
            </div>
          </div>

          <div class="col-md-6 col-lg-3">
            <div class="mb-3">
              <app-input label="From Date" type="date" formControlName="fromDate"></app-input>
            </div>
          </div>

          <div class="col-md-6 col-lg-3">
            <div class="mb-3">
              <app-input label="To Date" type="date" formControlName="toDate"></app-input>
            </div>
          </div>

          <div class="col-md-6 col-lg-4">
            <div class="mb-3">
              <app-input label="Search" type="text" formControlName="searchText" placeholder="Search by Claim no."></app-input>
            </div>
          </div>

          <div class="col-md-6 col-lg-2 d-flex align-items-end">
            <div class="mb-3">
              <app-btn label="Clear Filters" variant="secondary" (click)="clearFilters()"></app-btn>
            </div>
          </div>
        </div>
      </form>

      <!-- Filter Summary -->
      <div class="filter-summary mt-4 pt-3 border-top" *ngIf="filterSummary">
        <div class="row">
          <div class="col-md-3">
            <span class="summary-label">Claim Type:</span>
            <span class="summary-value">{{filterSummary.claimType}}</span>
          </div>
          <div class="col-md-3">
            <span class="summary-label">From Date:</span>
            <span class="summary-value">{{filterSummary.fromDate}}</span>
          </div>
          <div class="col-md-3">
            <span class="summary-label">To Date:</span>
            <span class="summary-value">{{filterSummary.toDate}}</span>
          </div>
          <div class="col-md-3">
            <span class="summary-label">Total Amount:</span>
            <span class="summary-value fw-bold">₹{{filterSummary.totalAmount.toLocaleString()}}</span>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-12">
            <span class="summary-label">Total Rows:</span>
            <span class="summary-value">{{filterSummary.totalRows}}</span>
          </div>
        </div>
      </div>

      <hr class="my-4">

      <!-- Table Section -->
      <div class="table-responsive">
        <app-data-table [columns]="tableColumns" [data]="getPaginatedClaims()" [sortable]="true"
          [actions]="tableActions" [isLoading]="isLoading && filteredClaims.length === 0"
          [emptyMessage]="'No Record Found'" (sort)="onSortFromTable($event)"></app-data-table>
      </div>

      <!-- Pagination -->
      <app-pagination *ngIf="filteredClaims.length > 0" [currentPage]="currentPage" [totalPages]="getTotalPages()"
        [totalItems]="totalItems" [itemsPerPage]="itemsPerPage" (pageChange)="onPageChange($event)"></app-pagination>
    </div>
  </app-card>
</div>

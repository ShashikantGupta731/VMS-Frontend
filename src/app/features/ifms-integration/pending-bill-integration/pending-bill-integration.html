<div class="pending-bills-container">
  <app-card>
    <div class="page-header mb-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title h4 fw-bold mb-0">Bills to be Discarded</h1>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a [routerLink]="['/vehicle']">Vehicle</a></li>
            <li class="breadcrumb-item active" aria-current="page">Bills to be Discarded</li>
          </ol>
        </nav>
      </div>
    </div>

    <!-- Stats summary -->
    <div class="filter-summary mb-4 p-4 bg-light rounded border border-light-subtle d-flex justify-content-between align-items-center" *ngIf="!isLoading">
      <div class="d-flex gap-4">
        <div>
          <span class="text-muted small d-block text-uppercase fw-semibold">Total Bills</span>
          <span class="fw-bold text-dark-blue mb-0">{{ totalItems }}</span>
        </div>
        <div class="border-start border-light-subtle ps-4">
          <span class="text-muted small d-block text-uppercase fw-semibold">Total Amount</span>
          <span class="fw-bold text-dark-blue mb-0">₹ {{ getTotalAmount() | number:'1.2-2' }}</span>
        </div>
      </div>
      <div>
        <app-btn label="Refresh" variant="outline-primary" size="sm" icon="pi pi-refresh" (click)="loadClaims()"></app-btn>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-responsive">
      <app-data-table 
        [columns]="tableColumns" 
        [data]="claims" 
        [actions]="tableActions" 
        [isLoading]="isLoading"
        emptyMessage="No pending bills found for discard evaluation."
      ></app-data-table>
    </div>
  </app-card>
</div>

<div class="user-list-container">
  <app-card>
    <div class="page-header d-flex justify-content-between align-items-center mb-4">
      <div class="header-left">
        <h1 class="page-title h3 mb-0">User Management</h1>
        <p class="text-muted mb-0">Manage system users, roles, and jurisdictions.</p>
      </div>
      <div class="header-right">
        <div class="d-flex gap-2">
          <app-btn label="Refresh" variant="secondary" icon="pi pi-refresh" (click)="refresh()"></app-btn>
          <app-btn label="Add New User" variant="primary" icon="pi pi-plus" routerLink="/user-management/add"></app-btn>
        </div>
      </div>
    </div>

    <div class="table-section">
      <app-data-table
        [columns]="tableColumns"
        [data]="users()"
        [actions]="tableActions"
        [isLoading]="isLoading()"
        [emptyMessage]="'No users found'"
      ></app-data-table>
    </div>
  </app-card>
</div>

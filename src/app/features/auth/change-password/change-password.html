<p-dialog header="Change Password" [modal]="true" [(visible)]="visible" [style]="{width: '500px'}" (onHide)="onHide()" [draggable]="false" [resizable]="false">
    <!-- Success/Error Alerts -->
    <div *ngIf="successMessage" class="alert alert-success mt-2">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger mt-2">{{ errorMessage }}</div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="mt-3">

        <!-- Old Password -->
        <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-control" formControlName="oldPassword"
                [ngClass]="{ 'is-invalid': submitted && f['oldPassword'].errors }">
            <div *ngIf="submitted && f['oldPassword'].errors" class="invalid-feedback">
                Current Password is required.
            </div>
        </div>

        <!-- New Password -->
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" formControlName="newPassword"
                [ngClass]="{ 'is-invalid': submitted && f['newPassword'].errors }">
            <div *ngIf="submitted && f['newPassword'].errors" class="invalid-feedback">
                <div *ngIf="f['newPassword'].errors['required']">New Password is required.</div>
                <div *ngIf="f['newPassword'].errors['minlength'] || f['newPassword'].errors['pattern']">
                    Password must be at least 8 characters long and contain 1 uppercase, 1 lowercase, 1 number, and 1
                    special character.
                </div>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-4">
            <label class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" formControlName="confirmPassword"
                [ngClass]="{ 'is-invalid': submitted && f['confirmPassword'].errors || (submitted && changePasswordForm.errors?.['mismatch']) }">
            <div *ngIf="submitted" class="invalid-feedback">
                <div *ngIf="f['confirmPassword'].errors?.['required']">Confirm Password is required.</div>
                <div *ngIf="changePasswordForm.errors?.['mismatch']">Passwords do not match.</div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-secondary" (click)="onHide()">Cancel</button>
            <button type="submit" class="btn btn-primary">Update Password</button>
        </div>
    </form>
</p-dialog>
